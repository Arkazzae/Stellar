name: stellarr-split

x-service: &service
  image: ${STELLARR_IMAGE:-ghcr.io/arkazzae/stellarr:${STELLARR_VERSION:-latest}}
  restart: unless-stopped
  entrypoint: ["/bin/bash", "/opt/split-entrypoint"]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, NET_BIND_SERVICE, SETGID, SETUID]
  pids_limit: 512

x-entrypoint: &entrypoint ../../infra/entrypoint.sh:/opt/split-entrypoint:ro
x-health: &health ./health.sh:/opt/split-health:ro
x-public: &public
  STELLARR_DOMAIN: ${STELLARR_DOMAIN:-}
  STELLARR_PUBLIC_IP: ${STELLARR_PUBLIC_IP:-}
  STELLARR_HTTPS_PORT: ${STELLARR_HTTPS_PORT:-443}
  STELLARR_PUBLIC_PORT: ${STELLARR_PUBLIC_PORT:-}
  STELLARR_MEDIA_PORT: ${STELLARR_MEDIA_PORT:-49000}

services:
  web:
    <<: *service
    command: [split-web]
    labels:
      net.unraid.docker.icon: https://raw.githubusercontent.com/Arkazzae/Stellarr/main/deploy/split/icons/web.png
    environment:
      <<: *public
      STELLARR_LANGUAGE: ${STELLARR_LANGUAGE:-en}
      STELLARR_PUBLIC_URL: ${STELLARR_PUBLIC_URL:-}
      STELLARR_TRUSTED_PROXIES: ${STELLARR_TRUSTED_PROXIES:-}
      STELLARR_ACTIVITY_DOMAIN: ${STELLARR_ACTIVITY_DOMAIN:-}
      STELLARR_ACTIVITY_ORIGIN: ${STELLARR_ACTIVITY_ORIGIN:-}
    ports:
      - "${STELLARR_HTTP_PORT:-127.0.0.1:8888}:80"
      - "${STELLARR_HTTPS_PORT:-443}:443"
    volumes:
      - *entrypoint
      - *health
      - web_data:/data/stellarr
    healthcheck:
      test: ["CMD", "bash", "/opt/split-health", "80", "/index.html"]
      interval: 10s
      start_interval: 1s
      start_period: 30s

  media:
    <<: *service
    command: [split-media]
    tmpfs: [/data/stellarr]
    labels:
      net.unraid.docker.icon: https://raw.githubusercontent.com/Arkazzae/Stellarr/main/deploy/split/icons/media.png
    environment:
      <<: *public
      STELLARR_MEDIA_LAN_IP: ${STELLARR_MEDIA_LAN_IP:-}
      STELLARR_MEDIA_ADVERTISE: ${STELLARR_MEDIA_ADVERTISE:-}
      STELLARR_MEDIA_LOG: ${STELLARR_MEDIA_LOG:-info}
    ports:
      - "${STELLARR_MEDIA_PORT:-49000}:49000/udp"
      - "${STELLARR_MEDIA_PORT:-49000}:49000/tcp"
    volumes:
      - *entrypoint
      - *health
      - media_key:/run/credentials/media
    healthcheck:
      test: ["CMD", "bash", "/opt/split-health", "5200", "/v1/health"]
      interval: 10s
      start_interval: 1s
      start_period: 30s

  api:
    <<: *service
    command: [split-api]
    labels:
      net.unraid.docker.icon: https://raw.githubusercontent.com/Arkazzae/Stellarr/main/deploy/split/icons/api.png
    # Only nginx can reach the HTTP listener over loopback.
    network_mode: service:web
    depends_on:
      web: {condition: service_healthy, restart: true}
      media: {condition: service_healthy}
    env_file:
      - path: ../../.env
        required: false
    environment:
      <<: *public
      STELLARR_DATA_ROOT: /data/stellarr
      STELLARR_TURN_ENABLED: "false"
    stop_grace_period: 35s
    volumes:
      - *entrypoint
      - *health
      - data:/data/stellarr
      - media_key:/run/credentials/media:ro
    healthcheck:
      test: ["CMD", "bash", "/opt/split-health", "5000", "/health/ready"]
      interval: 10s
      start_interval: 1s
      start_period: 60s

volumes:
  data:
  web_data:
  media_key:
