# One image per service, built from this checkout (README.md here).
# Run Compose from the checkout root with COMPOSE_FILE set in its .env; with
# -f options, pass --env-file .env too, or Compose looks for .env in this
# directory and the services start without the settings.
name: stellarr-services

x-service: &service
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  pids_limit: 512

x-public: &public
  STELLARR_DOMAIN: ${STELLARR_DOMAIN:-}
  STELLARR_PUBLIC_IP: ${STELLARR_PUBLIC_IP:-}
  STELLARR_HTTPS_PORT: ${STELLARR_HTTPS_PORT:-443}
  STELLARR_PUBLIC_PORT: ${STELLARR_PUBLIC_PORT:-}
  STELLARR_MEDIA_PORT: ${STELLARR_MEDIA_PORT:-49000}

services:
  credentials:
    build: {context: ../.., target: credentials-runtime}
    network_mode: none
    restart: "no"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    volumes:
      - media_key:/run/credentials/media

  web:
    <<: *service
    build: {context: ../.., target: web-runtime}
    labels:
      net.unraid.docker.icon: https://raw.githubusercontent.com/Arkazzae/Stellarr/main/deploy/services/icons/web.png
    environment:
      <<: *public
      STELLARR_LANGUAGE: ${STELLARR_LANGUAGE:-en}
      STELLARR_PUBLIC_URL: ${STELLARR_PUBLIC_URL:-}
      STELLARR_TRUSTED_PROXIES: ${STELLARR_TRUSTED_PROXIES:-}
      STELLARR_ACTIVITY_DOMAIN: ${STELLARR_ACTIVITY_DOMAIN:-}
      STELLARR_ACTIVITY_ORIGIN: ${STELLARR_ACTIVITY_ORIGIN:-}
    ports:
      - "${STELLARR_HTTP_PORT:-127.0.0.1:8888}:8080"
      - "${STELLARR_HTTPS_PORT:-443}:8443"
    volumes:
      - web_data:/data/stellarr
    healthcheck:
      test: ["CMD", "/usr/local/bin/http-health", "8080", "/index.html"]
      interval: 10s
      start_interval: 1s
      start_period: 30s

  media:
    <<: *service
    build: {context: ../.., target: media-runtime}
    depends_on:
      credentials: {condition: service_completed_successfully}
    labels:
      net.unraid.docker.icon: https://raw.githubusercontent.com/Arkazzae/Stellarr/main/deploy/services/icons/media.png
    environment:
      <<: *public
      STELLARR_MEDIA_LAN_IP: ${STELLARR_MEDIA_LAN_IP:-}
      STELLARR_MEDIA_ADVERTISE: ${STELLARR_MEDIA_ADVERTISE:-}
      STELLARR_MEDIA_LOG: ${STELLARR_MEDIA_LOG:-info}
    ports:
      - "${STELLARR_MEDIA_PORT:-49000}:49000/udp"
      - "${STELLARR_MEDIA_PORT:-49000}:49000/tcp"
    volumes:
      - media_key:/run/credentials/media:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/http-health", "5200", "/v1/health"]
      interval: 10s
      start_interval: 1s
      start_period: 30s

  api:
    <<: *service
    build: {context: ../.., target: api-runtime}
    labels:
      net.unraid.docker.icon: https://raw.githubusercontent.com/Arkazzae/Stellarr/main/deploy/services/icons/api.png
    # Only nginx can reach the HTTP listener over loopback.
    network_mode: service:web
    depends_on:
      web: {condition: service_healthy, restart: true}
      media: {condition: service_healthy}
    env_file:
      - path: ../../.env
        required: false
    environment:
      <<: *public
      STELLARR_DATA_ROOT: /data/stellarr
      STELLARR_TURN_ENABLED: "false"
    stop_grace_period: 35s
    volumes:
      - data:/data/stellarr
      - media_key:/run/credentials/media:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/http-health", "5000", "/health/ready"]
      interval: 10s
      start_interval: 1s
      start_period: 60s

volumes:
  data:
  web_data:
  media_key:
