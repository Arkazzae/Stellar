name: Build installer

on:
  workflow_call:
    inputs:
      artifacts:
        description: Upload the installers for publication
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  installer:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: init/installer
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component clippy --target ${{ matrix.target }} && rustup default stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: init/installer
          key: ${{ matrix.target }}
      - run: cargo clippy --locked --target ${{ matrix.target }} -- -D warnings
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - run: target/${{ matrix.target }}/release/stellarr-installer --help
      - if: inputs.artifacts
        run: cp target/${{ matrix.target }}/release/stellarr-installer stellarr-installer-${{ matrix.target }}
      - if: inputs.artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.target }}
          path: init/installer/stellarr-installer-${{ matrix.target }}
          if-no-files-found: error
