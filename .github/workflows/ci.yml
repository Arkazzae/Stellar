name: CI

# Runs for pull requests into main and for pushes to main; a push to any other
# branch runs nothing. A draft pull request runs nothing until it is marked ready
# for review. Each job runs only when files it checks have changed, so a change
# to the web client does not rebuild the server. A job that does not run counts
# as passed for branch protection. "Run workflow" on the Actions tab checks
# everything.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filter.outputs.api }}
      sdk: ${{ steps.filter.outputs.sdk }}
      web: ${{ steps.filter.outputs.web }}
      media: ${{ steps.filter.outputs.media }}
      init: ${{ steps.filter.outputs.init }}
      website: ${{ steps.filter.outputs.website }}
      installer: ${{ steps.filter.outputs.installer }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A manual run, the first push of a branch, or a base that is no
          # longer in the history checks everything.
          if [[ $EVENT == workflow_dispatch || -z $BASE || $BASE =~ ^0+$ ]] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            changed=ALL
          elif [[ $EVENT == pull_request ]]; then
            changed=$(git diff --name-only "$BASE...$HEAD")
          else
            changed=$(git diff --name-only "$BASE" "$HEAD")
          fi
          printf 'Changed files:\n%s\n' "$changed"
          check() {
            if [[ $changed == ALL ]] || grep -qE "$2" <<<"$changed"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          # Run the native tests when either shared fixture changes.
          check api '^(locales/|api/|sdk/(client|media|dev/room)\.js$|sdk/test/fixtures/manifest-parity\.json$|web/src/stellarr/lib/messages/message-syntax\.json$|\.github/workflows/ci\.yml$)'
          # web/ holds the web client and Cockpit (web/src/cockpit/). It is a
          # workspace of one npm project with the shared packages, so a change
          # to them or to the root manifest or lockfile runs the web job too.
          # Its tests also read nginx's configuration and the entrypoint, which
          # must answer the apps' addresses and write the instance language
          # file as web/ does. It checks the installed package files against the
          # manifest, so the Dockerfile stages and the bake file that build
          # them count too.
          check sdk '^(sdk/|package(-lock)?\.json$|\.github/workflows/ci\.yml$)'
          check web '^(locales/|web/|sdk/(dev/|host/|package\.json$)|artifacts/|packages/|package(-lock)?\.json$|website/src/images/logo/mono\.svg$|infra/(nginx\.conf|entrypoint\.sh)$|Dockerfile$|docker-bake\.hcl$|\.github/workflows/ci\.yml$)'
          check media '^(media/|\.github/workflows/ci\.yml$)'
          check init '^(init/|\.github/workflows/ci\.yml$)'
          # website/ is the project site, its own npm project outside the root
          # workspaces. It shares the shared Outfit files and serves install.sh.
          check website '^(website/|web/public/fonts/|install\.sh$|\.github/workflows/ci\.yml$)'
          # The installer, init/installer/ and the install.sh that fetches it,
          # downloads docker-compose.yml and .env.example and writes .env from
          # them, and its tests read both. The same job checks that the
          # settings in those two files are the ones the image reads and the
          # configuration page lists, and runs ShellCheck on the scripts that
          # read them.
          check installer '^(install\.sh$|init/installer/|infra/tests/(install|setting-names|entrypoint|smoke)|infra/(entrypoint|settings|stellarr-cli|tls-maintenance)\.sh$|deploy/services/[^/]+\.sh$|api/crates/server/src/settings/variables\.rs$|docs/install/configuration\.md$|docker-compose\.yml$|infra/compose/|\.env\.example$|\.github/workflows/(ci|installer-build)\.yml$)'
          # vite.config.ts, documents.ts and worklets.ts lay out the build that
          # nginx serves. The image job drills the process manager in the
          # image, so its sources count, not only its manifest. It takes the
          # recipes' outputs from the recipes job, which builds them with the
          # bake file.
          check image '^(locales/|deploy/services/|Dockerfile$|sdk/(dev/|host/|client\.js$|media\.js$|package\.json$)|docker-bake\.hcl$|\.dockerignore$|artifacts/|infra/|api/(Cargo\.(toml|lock)$|crates/[^/]+/(Cargo\.toml$|build\.rs$|src/|assets/))|packages/|package(-lock)?\.json$|\.npmrc$|web/|media/(Cargo\.(toml|lock)$|src/|build\.rs$)|docker-compose\.yml$|infra/compose/|init/(Cargo\.(toml|lock)$|src/)|\.github/workflows/ci\.yml$)'

  sdk:
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm run test:sdk

  # The API and the operator's tool, one Cargo workspace. --locked fails when
  # Cargo.lock no longer matches the manifests, as the image build would.
  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    # The tests take about five minutes; a cold build of the workspace, once
    # for clippy and once for the tests, takes most of the rest. A cached run
    # is far shorter.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: api
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-run
      # Every endpoint test starts a server on a data folder of its own under
      # the temporary folder, and SQLite syncs each commit to it. In memory a
      # sync costs nothing; the build above keeps the disk for its own files.
      # A mount of its own, because some tests run a script they wrote to the
      # temporary folder, and /dev/shm may be mounted noexec.
      - name: Mount a temporary folder in memory
        run: sudo mkdir -p /mnt/stellarr-tmp && sudo mount -t tmpfs -o size=4g,mode=1777 tmpfs /mnt/stellarr-tmp
      - run: cargo test --workspace --locked --no-fail-fast
        env:
          TMPDIR: /mnt/stellarr-tmp

  web-tests:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      # One install at the repository root covers every workspace.
      - run: npm ci
      - run: node scripts/npm/sync-manifest.mjs --check
      # Lint, typecheck and tests cover both apps in web/: the web client and
      # Cockpit, whose tests run as their own Vitest project.
      - run: npm run lint:web
      - run: npm run typecheck:ui
      - run: npm run typecheck:web
      - run: npm run test:web
      - run: npm run test:ui
      - run: npm run typecheck:icons
      - run: npm run test:icons
      - run: npm run typecheck:router
      - run: npm run test:router
      # Each playback strip and the speech detector's worklet, rendered in
      # Chromium against web/bench/voice/records/playback.txt.
      - name: Check voice playback in Chromium
        run: |
          chrome=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          if [[ -z $chrome ]]; then
            echo "::error::Chrome or Chromium is required for the voice playback check."
            exit 1
          fi
          STELLARR_CHROMIUM="$chrome" npm run bench:voice-playback -w stellarr-web -- \
            --check --out "$RUNNER_TEMP/voice-playback.json" --summary "$RUNNER_TEMP/voice-playback.md"
      # The largest difference of each kind against its tolerance, and the
      # Chrome the record was made with and the one on the runner, pass or fail.
      - name: Report voice playback check
        if: always()
        run: |
          if [[ -f $RUNNER_TEMP/voice-playback.md ]]; then
            cat "$RUNNER_TEMP/voice-playback.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '### Voice playback check\n\nNo report: the check did not run, or stopped before it compared anything; see its step.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      # src/paths.ts is built from the glyph source in
      # @stellarr/icons; a glyph changed in one place only fails here.
      - run: npm run icons:build -w @stellarr/icons -- --check
      # Every token the package reads must be defined by each app, the web
      # client and Cockpit, spelled as the package spells it, and listed in
      # its README.
      - run: npm run tokens:check -w @stellarr/ui
      # One build compiles both apps.
      - run: npm run build:web

  # The transcript fixture builds from tracked sources and can start before the recipes finish.
  web-transcript:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Check long transcript in Chromium
        run: |
          chrome=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          if [[ -z $chrome ]]; then
            echo "::error::Chrome or Chromium is required for the transcript benchmark."
            exit 1
          fi
          STELLARR_CHROMIUM="$chrome" npm run bench:transcript -w stellarr-web -- \
            --messages 1000,10000 --check --out "$RUNNER_TEMP/transcript-benchmark.json"
      - name: Report transcript benchmark
        if: always()
        run: |
          if [[ -f $RUNNER_TEMP/transcript-benchmark.json ]]; then
            {
              printf '### Transcript benchmark\n\n```json\n'
              cat "$RUNNER_TEMP/transcript-benchmark.json"
              printf '\n```\n'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # Keep the web check tied to both jobs while they run on separate runners.
  web:
    needs: [changes, web-tests, web-transcript]
    if: ${{ !cancelled() && needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check web job results
        env:
          WEB_TESTS: ${{ needs.web-tests.result }}
          WEB_TRANSCRIPT: ${{ needs.web-transcript.result }}
        run: |
          printf 'Web tests: %s\nTranscript benchmark: %s\n' "$WEB_TESTS" "$WEB_TRANSCRIPT"
          test "$WEB_TESTS" = success && test "$WEB_TRANSCRIPT" = success

  media:
    needs: changes
    if: needs.changes.outputs.media == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: media
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The runner image ships rustup. This moves it to the current stable
      # release, the one the image build takes from rust:1-slim-bookworm.
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: media
      - run: cargo fmt --check
      # --locked fails when Cargo.lock no longer matches Cargo.toml, as the
      # image build would.
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # Stellarr Init, the container's PID 1.
  init:
    needs: changes
    if: needs.changes.outputs.init == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: init
    env:
      # One scenario runs the test helper as nobody, which must be able to
      # reach it: the runner's home folder is closed to other users.
      CARGO_TARGET_DIR: /tmp/init-target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: init -> /tmp/init-target
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # The unit tests and the decisions on a fake clock need nothing of the
      # runner.
      - run: cargo test --locked --lib --test core
      # The PID 1 scenarios start the manager in PID namespaces of its own and
      # run services as nobody, which takes root. The runner allows it through
      # sudo, so the test binary is built as the runner's user and run as root.
      - name: Run the PID 1 scenarios
        run: |
          bin=$(cargo test --locked --test pid1 --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.name == "pid1") | .executable')
          sudo "$bin"

  # The project site.
  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: node --test test/server-downloads.test.js
      - run: ./node_modules/.bin/wrangler pages functions build --outdir "$RUNNER_TEMP/server-downloads-worker"
      - run: npm run build
      # The site serves the repository's installer as it is.
      - run: cmp dist/install.sh ../install.sh

  # Publishes the site to the Cloudflare Pages project behind stellarr.online
  # after a push to main that changed it, so the page and /install.sh always
  # match main. A pull request never deploys. One deployment at a time, and a
  # deployment that has started is never cancelled by a newer push.
  website-deploy:
    needs: website
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: website-production
    defaults:
      run:
        working-directory: website
    concurrency:
      group: website-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: cmp dist/install.sh ../install.sh
      - run: ./node_modules/.bin/wrangler pages deploy dist --project-name stellarr --branch main --commit-hash ${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # The one-command installer: the program in init/installer/ and install.sh,
  # which fetches it. Their tests run both against stub commands, with the
  # installer's HTTPS answered from files, and need neither Docker nor the
  # network themselves; the images below only hold the tools. They run on the
  # runner's bash with GNU tools, and in bash 3.2, the one macOS ships, with
  # BusyBox's. The installer is built static, for musl, so the same build
  # runs in both.
  installer:
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      STELLARR_INSTALLER_TEST_BIN: init/installer/target/x86_64-unknown-linux-musl/debug/stellarr-installer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --target x86_64-unknown-linux-musl && rustup default stable
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: init/installer
      - run: cargo fmt --check
        working-directory: init/installer
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: init/installer
      - run: cargo clippy --locked --all-targets --features test-seams -- -D warnings
        working-directory: init/installer
      - run: cargo test --locked --features test-seams
        working-directory: init/installer
      - run: cargo build --locked --features test-seams --target x86_64-unknown-linux-musl
        working-directory: init/installer
      - name: Check the scripts with ShellCheck
        run: docker run --rm -v "$PWD":/mnt:ro -w /mnt koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d -x install.sh infra/tests/install.test.sh infra/tests/setting-names.test.sh infra/tests/smoke.test.sh infra/settings.sh infra/entrypoint.sh infra/stellarr-cli.sh infra/tests/entrypoint.test.sh deploy/services/credentials.sh deploy/services/health.sh
      - name: Check production port mappings
        run: |
          docker compose config --format json | jq -e '
            .services.stellarr | .environment.STELLARR_TURN_ENABLED == "false" and
            ([.ports[] | select(.host_ip != "127.0.0.1") | "\(.published)/\(.protocol)"] | sort)
              == ["443/tcp", "49000/tcp", "49000/udp"] and
            any(.ports[]; .published == "8888" and .target == 80 and .host_ip == "127.0.0.1")'
          docker compose -f docker-compose.yml -f infra/compose/turn.yml config --format json | jq -e '
            .services.stellarr | .environment.STELLARR_TURN_ENABLED == "true" and
            ((["3478/tcp", "3478/udp", "5349/tcp", "5349/udp", "49160/udp", "49200/udp"]
              - [.ports[] | "\(.published)/\(.protocol)"]) == [])'
          STELLARR_TURN_RELAY_RANGE=55000-55002 docker compose \
            -f docker-compose.yml -f infra/compose/turn.yml config --format json | jq -e '
            .services.stellarr | .environment.STELLARR_TURN_RELAY_RANGE == "55000-55002" and
            ([.ports[] | select(.target >= 55000 and .target <= 55002)] | length) == 3 and
            all(.ports[] | select(.target >= 55000 and .target <= 55002);
              .protocol == "udp" and .published == (.target | tostring))'
      - name: Check the source build uses a local image
        run: |
          STELLARR_VERSION=1.2.3 docker compose config --format json | jq -e '
            .services.stellarr | .image == "ghcr.io/arkazzae/stellarr:1.2.3" and .build == null'
          STELLARR_VERSION=1.2.3 docker compose \
            -f docker-compose.yml -f infra/compose/build.yml config --format json | jq -e '
            .services.stellarr | .image == "stellarr-local:dev" and .pull_policy == "never" and .build != null'
      - name: Check Unraid container capabilities
        run: |
          docker compose config --format json > "$RUNNER_TEMP/stellarr-compose.json"
          python3 - "$RUNNER_TEMP/stellarr-compose.json" <<'PY'
          import json
          import shlex
          import sys
          import xml.etree.ElementTree as ET

          with open(sys.argv[1]) as source:
              service = json.load(source)["services"]["stellarr"]
          template = ET.parse("deploy/unraid/stellarr.xml")
          params = shlex.split(template.findtext("ExtraParams", ""))
          for option in ("cap_add", "cap_drop"):
              prefix = "--" + option.replace("_", "-") + "="
              actual = sorted(value.removeprefix(prefix) for value in params if value.startswith(prefix))
              expected = sorted(service.get(option, []))
              if actual != expected:
                  raise SystemExit(f"Unraid {option}: expected {expected}, got {actual}")
          PY
      - name: Check that every place names the same settings
        run: bash infra/tests/setting-names.test.sh
      - run: bash infra/tests/install.test.sh
      - name: Run the tests under bash 3.2 with BusyBox
        run: docker run --rm -v "$PWD":/w:ro -w /w -e STELLARR_INSTALLER_TEST_BIN bash:3.2.57@sha256:2556c2da19c32c1614d318645c73a7bf64d38be21cf69e98e3ca51f053983719 bash infra/tests/install.test.sh

  installer-targets:
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    uses: ./.github/workflows/installer-build.yml

  # Builds the image without pushing it, when the Dockerfile, the container
  # configuration or a dependency list changes. On main it also refreshes the
  # build cache that the release workflow reuses.
  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    # A cold run builds the API, the media server and Stellarr Init in Rust,
    # and the web client, before it starts the image.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check TLS certificate renewal
        run: bash infra/tests/tls-maintenance.test.sh
      # The entrypoint writes to /etc and /run, so its test runs as root in a
      # throwaway container of the image's base, with the services stubbed.
      # The same test runs the CLI's wrapper against a stub of the tool.
      - name: Check the entrypoint and the CLI's wrapper
        run: docker run --rm -v "$PWD":/w:ro -w /w ubuntu:24.04@sha256:9c7f200c07e3d4a03e7249d2c16bf66a51120fb876aa2242cf31451412543289 bash infra/tests/entrypoint.test.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: stellarr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and start the Compose services
        env:
          STELLARR_HTTPS_PORT: "18445"
          STELLARR_TURN_RELAY_RANGE: 49160-49162
        run: |
          stack=(docker compose -p stellarr-services-ci -f deploy/services/compose.yml)
          turn=(-f deploy/services/turn.yml)
          trap '"${stack[@]}" "${turn[@]}" down -v' EXIT
          # The README's route: from the checkout root, .env names the files.
          printf '%s\n' COMPOSE_FILE=deploy/services/compose.yml:deploy/services/turn.yml \
            COMPOSE_PROJECT_NAME=from-dotenv STELLARR_DOMAIN=chat.example.com >.env
          docker compose config --format json | jq -e '.name == "from-dotenv" and
            .services.web.environment.STELLARR_DOMAIN == "chat.example.com" and
            .services.api.environment.STELLARR_DOMAIN == "chat.example.com" and
            .services.turn.environment.STELLARR_DOMAIN == "chat.example.com"' >/dev/null
          rm .env
          "${stack[@]}" "${turn[@]}" build
          "${stack[@]}" up -d --wait --wait-timeout 90
          curl -kfSs https://localhost:18445/health/ready
          "${stack[@]}" "${turn[@]}" up -d --wait --wait-timeout 90
          "${stack[@]}" "${turn[@]}" exec -T api stellarr doctor
          for service in web api media turn; do
            "${stack[@]}" "${turn[@]}" exec -T "$service" sh -ec '
              grep -Eq "^Uid:[[:space:]]+999[[:space:]]" /proc/1/status
              grep -Eq "^CapEff:[[:space:]]+0+$" /proc/1/status
            '
          done
      # A build can succeed while a process inside cannot start, so run the
      # image and wait until its health check passes: stellarr-init reports
      # nginx, the API with its database, and the media server ready.
      # Only the interval is shorter than the image's, so that the drills
      # below see the container's health change within seconds; the check and
      # its retries are the image's own.
      - name: Start the image
        run: |
          docker run --rm --user stellarr:stellarr --entrypoint bash stellarr:ci -ec \
            'source /usr/local/lib/stellarr/settings.sh; declare -F read_or_create_secret >/dev/null'
          docker run -d --name stellarr -e STELLARR_DOMAIN=localhost -e STELLARR_LANGUAGE=pl \
            -e STELLARR_HTTPS_PORT=8443 --health-interval 5s -p 127.0.0.1:8443:443 stellarr:ci
          for _ in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' stellarr)
            [[ $status == healthy || $status == unhealthy ]] && break
            sleep 5
          done
          echo "Container health: $status"
          if [[ $status != healthy ]]; then
            docker logs stellarr 2>&1 | tail -n 80
            exit 1
          fi
      # nginx serves both apps as web/documents.ts says: a file as it is, an
      # app's address with that app's document, a missing file with a plain
      # 404, and any other address with the web client's document and a 404.
      - name: Check what nginx serves
        run: |
          failed=0
          fail() { echo "::error::$*"; failed=1; }
          # GETs $1 as a browser would, keeps the headers and the decoded body,
          # and checks the status against $2. A request that fails outright
          # has the status 000.
          get() {
            local status
            status=$(curl -ksS --compressed -D "$RUNNER_TEMP/headers" -o "$RUNNER_TEMP/body" \
              -w '%{http_code}' "https://localhost:8443$1" || true)
            [[ $status == "$2" ]] || fail "$1 answered $status, not $2."
          }
          header() { grep -i "^$1:" "$RUNNER_TEMP/headers" | cut -d' ' -f2- | tr -d '\r'; }
          body_has() { grep -qF "$1" "$RUNNER_TEMP/body"; }
          web_document() { body_has 'src="/stellarr-instance.js"' || fail "$1 is not the web client's document."; }
          cockpit_document() { body_has '<title>Stellarr Cockpit</title>' || fail "$1 is not Cockpit's document."; }
          secured() {
            [[ $(header x-content-type-options) == nosniff && -n $(header referrer-policy) \
               && -n $(header permissions-policy) ]] || fail "$1 lacks the security headers."
          }

          get /health 200
          secured /health
          for path in /login /invite/abc123; do
            get "$path" 200
            web_document "$path"
          done
          [[ $(header cache-control) == no-cache ]] || fail "The web client's document is cached."
          secured "the web client's document"
          for path in /cockpit /cockpit/users; do
            get "$path" 200
            cockpit_document "$path"
          done
          [[ $(header cache-control) == no-cache ]] || fail "Cockpit's document is cached."
          # The app draws its not-found page, and a monitor still sees the 404.
          get /no-such-page 404
          web_document /no-such-page
          # A page in place of a worklet would fail far from its cause.
          get /audio/no-such-worklet.js 404
          if body_has '<html'; then fail "A missing file was answered with a document."; fi

          get /login 200
          script=$(grep -o '/static/[^"]*\.js' "$RUNNER_TEMP/body" | head -n 1 || true)
          [[ -n $script ]] || fail "The web client's document names no script under /static/."
          get "$script" 200
          [[ $(header cache-control) == "public, max-age=31536000, immutable" ]] || fail "$script is not immutable."
          [[ $(header content-encoding) == gzip ]] || fail "$script is not compressed."
          secured "$script"

          # The exact bytes of instanceLanguageSource("pl") in
          # web/src/stellarr/i18n/localeScript.ts.
          get /stellarr-instance.js 200
          [[ $(header content-type) == "text/javascript; charset=utf-8" ]] || fail "/stellarr-instance.js has the wrong type."
          printf 'window.stellarrInstanceLanguage="pl";\n' | cmp -s - "$RUNNER_TEMP/body" \
            || fail "/stellarr-instance.js does not hold the language the container was given."

          while read -r path recorded; do
            get "/$path" 200
            [[ $(sha256sum < "$RUNNER_TEMP/body" | cut -d' ' -f1) == "$recorded" ]] || fail "Unexpected bytes for /$path."
          done < <(jq -r '.artifacts[] | [.path,.sha256] | @tsv' artifacts/manifest.json)
          for path in /audio/{detector,speex,rnnoise,gtcrn}-worklet.js; do
            get "$path" 200
            [[ $(header cache-control) == no-cache ]] || fail "$path is cached."
            body_has 'registerProcessor(' || fail "$path registers no processor."
          done

          if (( failed )); then
            docker logs stellarr 2>&1 | tail -n 80
            exit 1
          fi
      # docker exec starts the CLI without the entrypoint's exports; its
      # wrapper derives the public address by the same rules. The API's
      # canonical origin is that address as the entrypoint exported it.
      - name: Check that the CLI and the API agree on the public address
        run: |
          cli=$(docker exec stellarr stellarr --json config get public-url | jq -r '.data.value')
          api=$(curl -ksSf https://localhost:8443/.well-known/stellarr/client | jq -r '.canonicalOrigin')
          echo "The CLI's public-url is '$cli'; the API's canonical origin is '$api'."
          if [[ -z $cli || $cli != "$api" ]]; then
            echo "::error::The CLI and the API name different public addresses."
            exit 1
          fi
      # The binaries are served from the image, not proxied to a model host,
      # and the notices that describe them ship in the same image. nginx serves
      # the apps' files itself, so the image has no Node.js.
      - name: Check the image's contents
        run: |
          docker run --rm --entrypoint test stellarr:ci -f /opt/stellarr/web/index.html
          docker run --rm --entrypoint test stellarr:ci -f /usr/share/doc/stellarr/artifacts/NOTICES
          docker run --rm --entrypoint test stellarr:ci -f /usr/share/doc/stellarr/artifacts/manifest.json
          # grep exits with 1 when nothing matches, 0 on a match and 2 on an
          # error such as a missing file; only 1 passes.
          found=0
          docker run --rm --entrypoint grep stellarr:ci -rIqE 'storage\.googleapis\.com|bergamot-models-gcs' \
            /etc/nginx/nginx.conf.template /opt/stellarr/web || found=$?
          if (( found != 1 )); then
            echo "::error::The image names a model host, or grep could not read it (exit $found)."
            exit 1
          fi
          docker run --rm --entrypoint bash stellarr:ci -c '
            nodes=$(find / -xdev -type f -name node 2>/dev/null)
            if [[ -n $nodes ]]; then echo "::error::The image has Node.js: $nodes"; exit 1; fi'
          # stellarr-init runs the services; supervisord, and the Python it
          # needed, are gone.
          docker run --rm --entrypoint bash stellarr:ci -c '
            for tool in supervisord supervisorctl python3; do
              if command -v "$tool" >/dev/null; then echo "::error::The image has $tool."; exit 1; fi
            done
            # A package the base image once knew stays listed, as not installed.
            for package in supervisor python3 python3-minimal; do
              status=$(dpkg-query -W -f="\${Status}" "$package" 2>/dev/null || true)
              if [[ $status == "install ok installed" ]]; then
                echo "::error::The image has the $package package."; exit 1
              fi
            done'
      # The operator CLI ships in the same image and must work without the API.
      - name: Check the packaged operator CLI
        run: |
          docker run --rm --entrypoint stellarr stellarr:ci version
          docker run --rm --entrypoint stellarr stellarr:ci --help >/dev/null
      # A fresh instance, used the way a person would: the owner is founded
      # with the setup code from the log, signs in, writes, uploads, backs up
      # and restores, and the operator's tool reads the result. It runs a
      # container of its own, so the drills below see an untouched one.
      - name: Smoke-test the image
        run: STELLARR_SMOKE_IMAGE=stellarr:ci bash infra/tests/smoke.test.sh
      # The same again with 512 MB and one core, the size of a Raspberry Pi
      # Zero 2 W. Only a failed step fails it; the memory block it prints says
      # how much of that the instance takes.
      - name: Smoke-test the image in 512 MB and one core
        run: STELLARR_SMOKE_IMAGE=stellarr:ci STELLARR_SMOKE_LIMITS='--memory 512m --cpus 1' bash infra/tests/smoke.test.sh
      # The services run under stellarr-init as PID 1. Each drill takes one of
      # them down in a different way and checks what health says meanwhile,
      # that the others keep running, and that it comes back.
      - name: Drill the process manager
        run: |
          service_container=stellarr
          trap 'docker rm -f stellarr-turn-drill >/dev/null 2>&1 || true' EXIT
          fail() {
            echo "::error::$*"
            docker exec "$service_container" stellarr-init status || true
            docker logs "$service_container" 2>&1 | grep 'stellarr-init:' | tail -n 40
            exit 1
          }
          field() {
            docker exec "$service_container" stellarr-init status --json \
              | jq -r --arg name "$1" --arg key "$2" '.services[] | select(.name == $name) | .[$key]'
          }
          is() { [[ $(field "$1" state) == "$2" ]]; }
          unhealthy() { ! docker exec "$service_container" stellarr-init health >/dev/null 2>&1; }
          # Docker's status, where healthy also means that its last check
          # passed: a streak of failed checks outlasts a brief failure while
          # the status still reads healthy.
          container() {
            local health
            health=$(docker inspect -f '{{.State.Health.Status}} {{.State.Health.FailingStreak}}' "$service_container")
            if [[ $1 == healthy ]]; then [[ $health == "healthy 0" ]]; else [[ $health == "$1 "* ]]; fi
          }
          # Tries the command after it once a second for up to $1 seconds.
          within() {
            local seconds=$1; shift
            for _ in $(seq "$seconds"); do "$@" && return 0; sleep 1; done
            "$@"
          }
          signal() { docker exec "$service_container" bash -c "kill -$1 $2"; }

          [[ $(docker exec "$service_container" cat /proc/1/comm) == stellarr-init ]] || fail "PID 1 is not stellarr-init."
          docker exec "$service_container" stellarr-init health || fail "health fails in a healthy container."

          [[ -z $(field turn state) ]] || fail "coturn is running in the default image profile."

          # Killed outright: started again at once, under a new PID.
          pid=$(field media pid)
          signal KILL "$pid"
          within 30 is media ready || fail "media did not come back after SIGKILL."
          [[ $(field media pid) != "$pid" && $(field media restarts) == 1 ]] || fail "media was not restarted."
          docker exec "$service_container" stellarr-init health || fail "health fails after media came back."

          # Alive but silent: health fails after three missed checks, and the
          # same process is ready again once it answers. It is not restarted.
          pid=$(field api pid)
          signal STOP "$pid"
          if ! within 90 unhealthy; then signal CONT "$pid"; fail "health passed with the API stopped."; fi
          is api failing || { signal CONT "$pid"; fail "the stopped API is not reported as failing."; }
          within 30 container unhealthy || { signal CONT "$pid"; fail "the container stayed healthy with the API stopped."; }
          signal CONT "$pid"
          within 30 is api ready || fail "the API was not ready again."
          [[ $(field api pid) == "$pid" ]] || fail "the API was restarted for failing its check."
          within 30 container healthy || fail "the container's checks did not pass after the API."

          docker run -d --name stellarr-turn-drill -e STELLARR_TURN_ENABLED=true \
            -p 127.0.0.1::443/tcp --health-interval=5s stellarr:ci
          service_container=stellarr-turn-drill
          turn_https=$(docker port "$service_container" 443/tcp)
          within 90 container healthy || fail "the optional TURN profile did not become healthy."
          is turn ready || fail "the optional TURN service is missing."

          # Unable to start: the container turns unhealthy while the others
          # keep serving, and healthy again once it can start.
          docker exec "$service_container" chmod -x /usr/bin/turnserver
          docker exec "$service_container" stellarr-init restart turn
          started=$(date +%s)
          within 60 container unhealthy || fail "the container stayed healthy without coturn."
          echo "The container was unhealthy $(( $(date +%s) - started )) s after coturn stopped."
          for name in media api nginx; do is "$name" ready || fail "$name stopped when coturn could not start."; done
          curl -ksSf -o /dev/null "https://$turn_https/health" || fail "the API stopped answering without coturn."
          docker exec "$service_container" chmod +x /usr/bin/turnserver
          within 60 is turn ready || fail "coturn did not start once it could."
          within 30 container healthy || fail "the container did not become healthy again."
      # The last step: docker stop sends SIGTERM, and the manager stops the
      # services in order within its own 60 s, inside the 75 s grace period
      # docker-compose.yml gives the container.
      - name: Stop the container
        run: |
          started=$(date +%s%3N)
          docker stop -t 75 stellarr
          took=$(( $(date +%s%3N) - started ))
          code=$(docker inspect -f '{{.State.ExitCode}}' stellarr)
          docker logs stellarr 2>&1 | grep 'stellarr-init:' | tail -n 20
          echo "docker stop took ${took} ms; the container exited with $code."
          (( code == 0 )) || { echo "::error::The container exited with $code."; exit 1; }
          (( took < 75000 )) || { echo "::error::The stop took ${took} ms."; exit 1; }
