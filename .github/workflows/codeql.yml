name: CodeQL

# Runs when code changes on main or in a pull request that is ready for review,
# and once a week for advisories published since. Changes to documentation or
# configuration alone do not trigger it.
on:
  push:
    branches: [main]
    paths: ["api/**", "web/**", "sdk/**", ".github/workflows/codeql.yml"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["api/**", "web/**", "sdk/**", ".github/workflows/codeql.yml"]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    # Code scanning is not available to a private repository on the free plan,
    # so the job is skipped until the repository is public.
    if: github.event.repository.private == false && github.event.pull_request.draft != true
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Test code is left out of the Rust analysis only.
          config-file: ${{ matrix.language == 'rust' && './.github/codeql/rust.yml' || '' }}
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          category: /language:${{ matrix.language }}
