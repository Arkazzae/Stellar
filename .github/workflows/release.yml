name: Release

on:
  push:
    tags: ["v*.*.*"]

# Only this workflow may write: the release with its installers, the image in
# the registry and the attestations. It signs in with the token GitHub gives
# the run, no secret is set.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  queue: max

jobs:
  installer:
    uses: ./.github/workflows/installer-build.yml
    with:
      artifacts: true

  publish:
    needs: installer
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    # The arm64 half of the image is built under emulation.
    timeout-minutes: 120
    env:
      IMAGE: ghcr.io/arkazzae/stellarr
    steps:
      - id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import os
          import re

          tag = os.environ["TAG"]
          match = re.fullmatch(
              r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?", tag
          )
          if match is None or len(tag) > 129 or any(int(value) >= 2**64 for value in match.groups()[:3]):
              raise SystemExit(f"Invalid release tag: {tag}")
          for identifier in tag.partition("-")[2].split("."):
              if identifier.isdecimal() and len(identifier) > 1 and identifier.startswith("0"):
                  raise SystemExit(f"Invalid numeric prerelease identifier: {identifier}")
          PYTHON
          draft=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -r --arg tag "$TAG" '.[][] | select(.tag_name == $tag) | .draft')
          if [[ $draft == false ]]; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
        if: steps.release.outputs.published != 'true'
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.release.outputs.published != 'true'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.release.outputs.published != 'true'
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.release.outputs.published != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: steps.release.outputs.published != 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: type=semver,pattern={{version}}
      # Read only: the caches CI fills on main, the image job's and one per
      # recipe of artifacts/recipes/, which the recipes job writes and the
      # image job does not build. A cache written under a tag would never be
      # used again.
      - id: cache
        if: steps.release.outputs.published != 'true'
        name: List the caches to read
        run: |
          {
            echo 'from<<EOF'
            echo 'type=gha'
            for recipe in artifacts/recipes/*/; do
              echo "type=gha,scope=recipe-$(basename "$recipe")"
            done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - id: build
        if: steps.release.outputs.published != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: ${{ steps.cache.outputs.from }}
      # Storage records need an organization-owned repository.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        if: steps.release.outputs.published != 'true'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  verify-image-pull:
    needs: publish
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE: ghcr.io/arkazzae/stellarr
      TAG: ${{ github.ref_name }}
    steps:
      - name: Pull the versioned image without signing in
        run: |
          registry_config=$(mktemp -d)
          trap 'rm -rf -- "$registry_config"' EXIT
          if ! docker --config "$registry_config" pull "$IMAGE:${TAG#v}"; then
            echo "::error::The versioned image could not be pulled anonymously. Check the GHCR package visibility and rerun this job."
            exit 1
          fi

  # Hold this lock from publication through promotion so a late-finishing
  # release cannot replace a newer stable tag.
  release:
    needs: [verify-image-pull, installer]
    concurrency:
      group: release-promotion
      queue: max
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      IMAGE: ghcr.io/arkazzae/stellarr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: assets
          merge-multiple: true
      - name: Sum the four installers
        working-directory: assets
        run: |
          sha256sum stellarr-installer-{aarch64,x86_64}-{apple-darwin,unknown-linux-musl} > stellarr-installer.sha256
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: assets/stellarr-installer-*
      - name: Publish GitHub release with installer assets
        shell: bash
        run: |
          draft=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -r --arg tag "$TAG" '.[][] | select(.tag_name == $tag) | .draft')
          if [[ $draft == false ]]; then
            exit 0
          fi

          args=(--generate-notes --verify-tag --draft --latest=false)
          if [[ $TAG == *-* ]]; then
            args+=(--prerelease)
          fi
          if [[ -z $draft ]]; then
            gh release create "$TAG" "${args[@]}"
          fi
          gh release upload "$TAG" assets/stellarr-installer-* assets/stellarr-installer.sha256 --clobber
          gh release edit "$TAG" --draft=false --latest=false
      - name: Verify the published installer assets
        run: |
          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[].name')
          for name in stellarr-installer-{aarch64,x86_64}-{apple-darwin,unknown-linux-musl} stellarr-installer.sha256; do
            grep -Fx "$name" <<< "$assets"
          done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: ${{ !contains(github.ref_name, '-') }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: ${{ !contains(github.ref_name, '-') }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the stable image
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          python3 - <<'PYTHON' > promotions.txt
          import json
          import os
          import re

          def parse(tag):
              match = re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag)
              return tuple(map(int, match.groups())) if match else None

          with open("releases.json") as source:
              published = {
                  version
                  for page in json.load(source)
                  for release in page
                  if not release["draft"] and not release["prerelease"]
                  if (version := parse(release["tag_name"])) is not None
              }
          version = parse(os.environ["TAG"])
          if version not in published:
              raise SystemExit("The new release did not appear in the GitHub release list.")
          series = version[:2]
          if version == max(candidate for candidate in published if candidate[:2] == series):
              print(f"{series[0]}.{series[1]}")
          if version == max(published):
              print("latest")
          PYTHON
          registry_config=$(mktemp -d)
          trap 'rm -rf -- "$registry_config"' EXIT
          while IFS= read -r alias; do
            docker buildx imagetools create --tag "$IMAGE:$alias" "$IMAGE:${TAG#v}"
            docker --config "$registry_config" manifest inspect "$IMAGE:$alias" > /dev/null
            if [[ $alias == latest ]]; then
              gh release edit "$TAG" --latest
            fi
          done < promotions.txt
