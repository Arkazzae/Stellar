name: Release server

on:
  push:
    tags: ["server-v*.*.*"]

# Server images and native installer bundles are published in GHCR.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  queue: max

jobs:
  installer:
    uses: ./.github/workflows/installer-build.yml
    with:
      artifacts: true

  publish:
    needs: installer
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    # The arm64 half of the image is built under emulation.
    timeout-minutes: 120
    env:
      IMAGE: ghcr.io/arkazzae/stellarr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: release
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import os
          import re

          tag = os.environ["TAG"].removeprefix("server-")
          match = re.fullmatch(
              r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?", tag
          )
          if match is None or len(tag) > 129 or any(int(value) >= 2**64 for value in match.groups()[:3]):
              raise SystemExit(f"Invalid release tag: {tag}")
          for identifier in tag.partition("-")[2].split("."):
              if identifier.isdecimal() and len(identifier) > 1 and identifier.startswith("0"):
                  raise SystemExit(f"Invalid numeric prerelease identifier: {identifier}")
          PYTHON
          version=${TAG#server-v}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          token=$(curl -fsS --retry 3 'https://ghcr.io/token?service=ghcr.io&scope=repository:arkazzae/stellarr:pull' | jq -er .token)
          bundle=$(python3 scripts/release/server-release.py tag "$version")
          # A completed bundle is published only after its signed server image.
          # A retry before that point can rebuild and attest the candidate.
          status() {
            curl -sS --retry 3 -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $token" -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://ghcr.io/v2/arkazzae/stellarr/manifests/$1"
          }
          case "$(status "$bundle")" in
            200) [[ $(status "$version") == 200 ]]; echo 'published=true' >> "$GITHUB_OUTPUT" ;;
            404) ;;
            *) echo "Could not check the installer registry" >&2; exit 1 ;;
          esac
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: ${{ steps.release.outputs.published != 'true' }}
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: ${{ steps.release.outputs.published != 'true' }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: ${{ steps.release.outputs.published != 'true' }}
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: type=semver,pattern={{version}},value=${{ steps.release.outputs.version }}
      - id: build
        if: ${{ steps.release.outputs.published != 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
      # Storage records need an organization-owned repository.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        if: steps.release.outputs.published != 'true'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  verify-image-pull:
    needs: publish
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE: ghcr.io/arkazzae/stellarr
      TAG: ${{ github.ref_name }}
    steps:
      - name: Pull the versioned image without signing in
        run: |
          registry_config=$(mktemp -d)
          trap 'rm -rf -- "$registry_config"' EXIT
          if ! docker --config "$registry_config" pull "$IMAGE:${TAG#server-v}"; then
            echo "::error::The versioned image could not be pulled anonymously. Check the GHCR package visibility and rerun this job."
            exit 1
          fi

  # Hold this lock from publication through promotion so a late-finishing
  # release cannot replace a newer stable tag.
  release:
    needs: [verify-image-pull, installer]
    outputs:
      promoted-latest: ${{ steps.promote.outputs.latest }}
    concurrency:
      group: release-promotion
      queue: max
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.ref_name }}
      IMAGE: ghcr.io/arkazzae/stellarr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: assets
          merge-multiple: true
      - name: Sum the four installers
        working-directory: assets
        run: |
          sha256sum stellarr-installer-{aarch64,x86_64}-{apple-darwin,unknown-linux-musl} > stellarr-installer.sha256
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: assets/stellarr-installer-*
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          version: 1.3.0
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish and verify the native installer bundle
        run: python3 scripts/release/server-release.py publish "${TAG#server-v}" assets
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
      - run: npm ci
      - name: Install and exercise the public release on a fresh host
        run: |
          export STELLARR_CHROMIUM=$(command -v google-chrome)
          bash scripts/release/test-install.sh "${TAG#server-v}"
      - name: Promote the tested server image and installer channels
        id: promote
        run: |
          version=${TAG#server-v}
          if [[ $version != *-* ]]; then
            python3 scripts/release/server-release.py promote "$version"
          fi

  verify-stable-install:
    needs: release
    if: needs.release.outputs.promoted-latest == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 10
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install and update from the project website
        run: bash scripts/release/test-stable-install.sh "${TAG#server-v}"
