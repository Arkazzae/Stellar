<!doctype html>
<html lang="en" data-locale="en">
  <head>
    <meta charset="utf-8" />
    <!-- Zooming to 200% is a WCAG requirement, so the scale is never locked. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <title>Stellarr</title>
    <!-- English until the locale script below puts it in the page's language. -->
    <meta name="description" content="A small, self-hosted place to talk." />
    <meta name="application-name" content="Stellarr" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/src/stellarr/assets/icon.svg" type="image/svg+xml" sizes="any" />
    <!-- The instance's default language, from STELLARR_LANGUAGE. One image serves
         every instance, so it cannot be built in: the container writes this file
         when it starts. It blocks on purpose, as the next script reads it. -->
    <script src="/stellarr-instance.js" vite-ignore></script>
    <!-- The language and theme scripts, written in from src/stellarr/i18n/localeScript.ts
         and src/stellarr/design/themeScript.ts by vite.config.ts. They put the
         language and theme on <html> before the first paint. -->
    <!-- pre-paint -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/stellarr/main.tsx"></script>
  </body>
</html>
