# Over docker-compose.dev.yml for the throwaway instance the film is captured
# from: the same instance on every machine, whatever the shell or film.env
# hold, and no rate limit in the way of the seed script.
services:
  web:
    environment:
      STELLARR_LANGUAGE: en
  api:
    environment:
      STELLARR_LANGUAGE: en
      STELLARR_MAIL_ENABLED: "false"
      RateLimiting__AuthWrite__PermitLimit: "1000"
      RateLimiting__Login__PermitLimit: "1000"
      RateLimiting__Uploads__PermitLimit: "1000"
