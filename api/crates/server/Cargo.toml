[package]
name = "stellarr-api"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The Stellarr API server"

[lib]
name = "stellarr_api"
path = "src/lib.rs"

[[bin]]
name = "stellarr-api"
path = "src/main.rs"

[dependencies]
stellarr-messages = { path = "../messages" }
aws-lc-rs = { workspace = true }
axum = { workspace = true, features = ["tokio", "http1", "matched-path"] }
bytes = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio", "server", "http1", "service"] }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util", "fs", "process"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true

[dev-dependencies]
hyper = { workspace = true, features = ["client", "http1"] }
