[package]
name = "stellarr-api"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The Stellarr API server"

[lib]
name = "stellarr_api"
path = "src/lib.rs"

[[bin]]
name = "stellarr-api"
path = "src/main.rs"

[dependencies]
stellarr-embeds = { path = "../embeds" }
stellarr-mail = { path = "../mail" }
stellarr-mentions = { path = "../mentions" }
stellarr-hub = { path = "../hub" }
stellarr-messages = { path = "../messages" }
stellarr-outbound = { path = "../outbound" }
stellarr-smtp = { path = "../smtp" }
stellarr-storage = { path = "../storage" }
stellarr-timezone = { path = "../timezone" }
stellarr-unicode = { path = "../unicode" }
stellarr-webauthn = { path = "../webauthn" }
aws-lc-rs = { workspace = true }
axum = { workspace = true, features = ["tokio", "http1", "matched-path", "query"] }
bytes = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
rusqlite = { workspace = true }
rustls = { workspace = true, features = ["aws-lc-rs", "std", "tls12"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs", "io-util", "process"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true

[dev-dependencies]
stellarr-websocket = { path = "../websocket" }
http = { workspace = true }
# The unit tests of the permission rules count the statements a check runs.
rusqlite = { workspace = true, features = ["trace"] }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = ["io-util", "process"] }
tokio-rustls = { workspace = true, features = ["aws-lc-rs", "tls12"] }
