[package]
name = "stellarr-discord"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Reads a Discord server, from a template link or with a bot token, into a snapshot in Stellarr's own terms"

[dependencies]
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
stellarr-mentions = { path = "../mentions" }
stellarr-outbound = { path = "../outbound" }
stellarr-unicode = { path = "../unicode" }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }

[lints]
workspace = true
