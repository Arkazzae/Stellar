[package]
name = "stellarr-mail"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The mail the server writes: every kind of message, the choice of transport and the Resend request"

[dependencies]
serde.workspace = true
serde_json.workspace = true
stellarr-messages = { path = "../messages" }
stellarr-smtp = { path = "../smtp" }
stellarr-timezone = { path = "../timezone" }

# Only the test that sends every kind of message to a real server needs these.
[dev-dependencies]
rustls.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util", "time"] }

[lints]
workspace = true
