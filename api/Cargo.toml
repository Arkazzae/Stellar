# The API: one workspace, one crate per folder under crates/.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

# One version of each shared crate for the whole workspace. A crate asks for
# the features it needs in its own manifest.
[workspace.dependencies]
aws-lc-rs = "1.19"
axum = { version = "0.8", default-features = false }
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = "1"
hyper-util = "0.1"
rusqlite = { version = "0.43", features = ["bundled"] }
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"
tokio-rustls = "0.26"
tracing = "0.1"
tracing-subscriber = "0.3"

# Dependencies are optimised in development and test builds too. They are
# compiled once and then cached, and the tests spend most of their time in
# them: SQLite, the password derivation in aws-lc, hyper. The workspace's own
# crates stay unoptimised, so a change to one of them rebuilds as fast as
# before.
[profile.dev.package."*"]
opt-level = 3

# The split-point tests decode the same streams at many input boundaries.
[profile.test.package.stellarr-deflate]
opt-level = 3
