# Production stack: one container runs Nginx, the API and the Stellarr
# Media server, and Nginx serves the web client and Cockpit.
#
#   docker compose up -d           uses a published image
#   ./install.sh --build           builds the image from this checkout
#
# Settings go in .env, which the container reads as it is; the image holds
# every default. See docs/install/configuration.md.
#
# The project, service, container and volume names are fixed. Docker names
# the data volume after the project and the volume key (stellarr_stellarr_data),
# so a change to any of them starts the installation on an empty database.

name: stellarr

services:
  stellarr:
    image: ${STELLARR_IMAGE:-ghcr.io/arkazzae/stellarr:${STELLARR_VERSION:-latest}}
    container_name: stellarr
    labels:
      net.unraid.docker.icon: https://raw.githubusercontent.com/Arkazzae/Stellarr/main/deploy/unraid/tile.png
    restart: unless-stopped
    # The process manager stops the services one at a time and the API alone
    # may take 35 s; Docker's default of 10 s would kill them part-way.
    stop_grace_period: 75s
    mem_limit: ${STELLARR_CONTAINER_MEMORY_LIMIT:-4g}
    cpus: ${STELLARR_CONTAINER_CPUS:-4}
    pids_limit: ${STELLARR_CONTAINER_PIDS_LIMIT:-512}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    env_file:
      - path: .env
        required: false
    environment:
      # The host side of the ports below, which the container cannot see.
      STELLARR_HTTPS_PORT: ${STELLARR_HTTPS_PORT:-443}
      STELLARR_MEDIA_PORT: ${STELLARR_MEDIA_PORT:-49000}
      STELLARR_TURN_ENABLED: ${STELLARR_TURN_ENABLED:-false}
    ports:
      - "${STELLARR_HTTP_PORT:-127.0.0.1:8888}:80"
      - "${STELLARR_HTTPS_PORT:-443}:443"
      # Every call goes through this port, and browsers are told
      # STELLARR_PUBLIC_IP with it: the router forwards the same external port.
      - "${STELLARR_MEDIA_PORT:-49000}:49000/udp"
      - "${STELLARR_MEDIA_PORT:-49000}:49000/tcp"
    volumes:
      - stellarr_data:/data/stellarr

volumes:
  stellarr_data:
