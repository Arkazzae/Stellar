# Template: the entrypoint replaces __PUBLIC_HTTPS_SUFFIX__ and writes the result
# to /etc/nginx/nginx.conf.
user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    # The web client's sounds; the stock list has no type for them.
    types {
        audio/wav wav;
    }
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Larger than the API's 100 MB video limit so multipart framing still fits.
    # The API enforces the per-media limits itself.
    client_max_body_size 128m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # A TLS proxy in front of this container (Nginx Proxy Manager, Caddy, a load
    # balancer) forwards plain HTTP and says so in X-Forwarded-Proto. Such a
    # request must not be redirected to HTTPS again, and the API has to see
    # "https" so that secure cookies and generated links are right.
    map $http_x_forwarded_proto $external_https {
        default 0;
        https   1;
    }

    map "$scheme:$external_https" $redirect_to_https {
        default  0;
        "http:0" 1;
    }

    map $external_https $effective_forwarded_proto {
        default $scheme;
        1       https;
    }

    # The cache policy of the files nginx serves for the web client, by the
    # file served. Anything else, the API's and Cockpit's responses among
    # them, gets an empty value, and nginx adds no header for it.
    map $request_filename $client_cache_control {
        default                                  "";
        # Named by their content: a new build gets new names.
        ~^/srv/web/_next/static/                 "public, max-age=31536000, immutable";
        # Self-hosted fonts and the translation codecs never change in place.
        ~^/srv/web/(fonts|codecs/bergamot)/      "public, max-age=31536000, immutable";
        # These names are stable, but what they hold can change with a release.
        /srv/web/bergamot-worker.js              "public, max-age=3600, must-revalidate";
        /srv/web/bergamot-models/registry.json   "public, max-age=3600, must-revalidate";
        # Pages, the payloads the router fetches and every other file keep
        # their names across releases, so the browser asks each time and a
        # release takes effect at the next load.
        ~^/srv/web/                              "no-cache";
        # Written by the entrypoint at every start. The page waits for it
        # before its first paint, so asking each time would cost a round
        # trip on every load; the setting rarely changes, and a new value
        # reaches a browser within the hour.
        /run/stellarr/stellarr-instance.js       "public, max-age=3600, must-revalidate";
    }

    upstream stellarr_api {
        server 127.0.0.1:5000;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name _;

        if ($redirect_to_https) {
            return 308 https://$host__PUBLIC_HTTPS_SUFFIX__$request_uri;
        }

        ssl_certificate     /data/stellarr/tls/fullchain.pem;
        ssl_certificate_key /data/stellarr/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Redirects nginx makes itself (/cockpit, /ops) keep a relative Location:
        # an absolute one would carry the container's port 443, not the
        # published one (8443 by default), and send the browser elsewhere.
        absolute_redirect off;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "microphone=(self), camera=(self), display-capture=(self)" always;
        # Set here and not in the client's locations: a location with an
        # add_header of its own would drop the three above.
        add_header Cache-Control $client_cache_control always;

        location = /health {
            proxy_pass http://stellarr_api/health/ready;
            proxy_set_header Host $host;
        }

        # The desktop client's handshake reports the instance's origin, taken
        # from X-Forwarded-Host so that it keeps the port the client used.
        location = /.well-known/stellarr/client {
            proxy_pass http://stellarr_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;
        }

        # The instance's default language, read by the web client before its
        # first paint. The entrypoint writes it from STELLARR_LANGUAGE.
        location = /stellarr-instance.js {
            root /run/stellarr;
        }

        # Plain HTTP only: the API has no WebSocket endpoint outside /hubs/.
        location ~ ^/(api|assets|health)/ {
            proxy_pass http://stellarr_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;
            proxy_read_timeout 75s;
        }

        location /hubs/ {
            proxy_pass http://stellarr_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;
            proxy_read_timeout 75s;
        }

        # Translation models are fetched only after a user turns on local chat
        # translation. Serving them from this origin avoids CORS and lets the
        # browser keep them in IndexedDB. The upstream path must match the
        # rewrite in web/next.config.ts.
        location /bergamot-models-gcs/ {
            proxy_pass https://storage.googleapis.com/bergamot-models-sandbox/0.3.3/;
            proxy_ssl_server_name on;
            proxy_set_header Host storage.googleapis.com;
            proxy_hide_header Access-Control-Allow-Origin;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "public, max-age=86400" always;
        }

        # The operator panel, Cockpit, is built with base /cockpit/.
        location = /cockpit {
            return 308 /cockpit/;
        }

        location /cockpit/ {
            root /srv;
            try_files $uri $uri/ /cockpit/index.html;
        }

        # The panel's address before it was named Cockpit, kept for bookmarks.
        location ~ ^/ops(/.*)?$ {
            return 308 /cockpit$1$is_args$args;
        }

        # The web client: the static export of web/ (next build), with a
        # gzipped copy beside each text file. Every page is login.html for
        # /login and so on, and /login.txt and /login/__next.*.txt are the
        # payloads the router fetches to navigate there without a reload.
        location / {
            root /srv/web;
            charset utf-8;
            charset_types text/plain text/css application/javascript application/json image/svg+xml;
            error_page 404 /404.html;

            # The files are compressed when the image is built; anything
            # without a .gz beside it is compressed here. Only this location
            # compresses, so the API's responses go out as before. A proxy in
            # front may speak HTTP/1.0 or add Via, and its clients still get
            # compressed files.
            gzip on;
            gzip_static on;
            gzip_vary on;
            gzip_proxied any;
            gzip_http_version 1.0;
            gzip_types text/css text/plain application/javascript application/json image/svg+xml application/wasm;

            # /login/ goes to /login, as it did from Next. The target never
            # starts with two slashes, which a browser reads as another host.
            rewrite ^(/[^/].*)/$ $1 permanent;
            try_files $uri $uri.html =404;

            location = / {
                try_files /index.html =404;
            }

            location = /404.html {
                internal;
            }

            # A page answers at its own address only: /login, not /login.html.
            location ~ ^/(invite/)?[^/]+\.html$ {
                return 404;
            }

            # One rendering serves every invite code: the page reads the code
            # from the address (web/src/app/invite/[code]/page.tsx). The
            # router's payloads for a code are that rendering's too.
            location ~ ^/invite/[^/]+\.txt$ {
                try_files /invite/_.txt =404;
            }

            location ~ ^/invite/[^/]+/(__next\.[^/]+\.txt)$ {
                try_files /invite/_/$1 =404;
            }

            location ~ ^/invite/[^/]+$ {
                try_files /invite/_.html =404;
            }
        }
    }
}
