# Template: the entrypoint replaces __PUBLIC_HTTPS_SUFFIX__ and writes the result
# to /etc/nginx/nginx.conf.
user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Larger than the API's 100 MB video limit so multipart framing still fits.
    # The API enforces the per-media limits itself.
    client_max_body_size 128m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # A TLS proxy in front of this container (Nginx Proxy Manager, Caddy, a load
    # balancer) forwards plain HTTP and says so in X-Forwarded-Proto. Such a
    # request must not be redirected to HTTPS again, and the API has to see
    # "https" so that secure cookies and generated links are right.
    map $http_x_forwarded_proto $external_https {
        default 0;
        https   1;
    }

    map "$scheme:$external_https" $redirect_to_https {
        default  0;
        "http:0" 1;
    }

    map $external_https $effective_forwarded_proto {
        default $scheme;
        1       https;
    }

    # The cache policy of the one file nginx serves itself. Anything else
    # gets an empty value, and nginx adds no header for it: the web client's
    # server sets its own.
    map $request_filename $client_cache_control {
        default                                  "";
        # Written by the entrypoint at every start. The page waits for it
        # before its first paint, so asking each time would cost a round
        # trip on every load; the setting rarely changes, and a new value
        # reaches a browser within the hour.
        /run/stellarr/stellarr-instance.js       "public, max-age=3600, must-revalidate";
    }

    upstream stellarr_web {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    upstream stellarr_api {
        server 127.0.0.1:5000;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name _;

        if ($redirect_to_https) {
            return 308 https://$host__PUBLIC_HTTPS_SUFFIX__$request_uri;
        }

        ssl_certificate     /data/stellarr/tls/fullchain.pem;
        ssl_certificate_key /data/stellarr/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Redirects nginx makes itself (/cockpit) keep a relative Location:
        # an absolute one would carry the container's port 443, not the
        # published one (8443 by default), and send the browser elsewhere.
        absolute_redirect off;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "microphone=(self), camera=(self), display-capture=(self)" always;
        # Set here and not in the client's locations: a location with an
        # add_header of its own would drop the three above.
        add_header Cache-Control $client_cache_control always;

        location = /health {
            proxy_pass http://stellarr_api/health/ready;
            proxy_set_header Host $host;
        }

        # The desktop client's handshake reports the instance's origin, taken
        # from X-Forwarded-Host so that it keeps the port the client used.
        location = /.well-known/stellarr/client {
            proxy_pass http://stellarr_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;
        }

        # The instance's default language, read by the web client before its
        # first paint. The entrypoint writes it from STELLARR_LANGUAGE.
        location = /stellarr-instance.js {
            root /run/stellarr;
        }

        # Plain HTTP only: the API has no WebSocket endpoint outside /hubs/.
        location ~ ^/(api|assets|health)/ {
            proxy_pass http://stellarr_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;
            proxy_read_timeout 75s;
        }

        location /hubs/ {
            proxy_pass http://stellarr_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;
            proxy_read_timeout 75s;
        }

        # The operator panel, Cockpit, is built with base /cockpit/.
        location = /cockpit {
            return 308 /cockpit/;
        }

        location /cockpit/ {
            root /srv;
            try_files $uri $uri/ /cockpit/index.html;
        }

        # The web client, rendered by its Next.js server.
        location / {
            proxy_pass http://stellarr_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;
        }
    }
}
