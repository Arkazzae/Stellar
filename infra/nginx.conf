# Template rendered by the entrypoint into /etc/nginx/nginx.conf.
user www-data;
# Two workers, whatever the host: nginx here terminates TLS, proxies to the API
# on loopback and serves the web apps' files. `auto` would start one per core of
# the host, not of the container's CPU limit. With 2048 connections each, two
# workers hold 4096, and a proxied request or WebSocket takes two (the client's
# and the upstream's): about 2000 at once.
worker_processes 2;
pid /run/nginx.pid;
# Errors go to the container's log with every other service's, never to a file
# under /var/log that nothing rotates. stellarr-init starts nginx with
# -e stderr, so that the errors before this file is read go there too.
error_log stderr;

events {
    worker_connections 2048;
}

http {
    # No access log. Every request to the API is logged by the API itself, with
    # its path, status and duration; what nginx alone serves is the apps' files,
    # whose every load would repeat a dozen lines per page view in the
    # container's log, and the container's own health checks every ten seconds.
    access_log off;

    include /etc/nginx/mime.types;
    # The web client's sounds; the stock list has no type for them.
    types {
        audio/wav wav;
    }
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Larger than the API's 100 MB video limit so multipart framing still fits.
    # The API enforces the per-media limits itself.
    client_max_body_size 128m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # A TLS proxy in front of this container (Nginx Proxy Manager, Caddy, a load
    # balancer) forwards plain HTTP and says so in X-Forwarded-Proto. Such a
    # request must not be redirected to HTTPS again, and the API has to see
    # "https" so that secure cookies and generated links are right.
    geo $stellarr_trusted_proxy {
        default 0;
        127.0.0.0/8 1;
        ::1 1;
        include /etc/nginx/stellarr-trusted-proxies.conf;
    }

    map "$stellarr_trusted_proxy:$http_x_forwarded_proto" $external_https {
        default 0;
        "1:https" 1;
    }

    map $stellarr_trusted_proxy $stellarr_forwarded_for {
        default $remote_addr;
        1 $proxy_add_x_forwarded_for;
    }

    map "$scheme:$external_https" $redirect_to_https {
        default  0;
        "http:0" 1;
    }

    map $external_https $effective_forwarded_proto {
        default $scheme;
        1       https;
    }

    map $effective_forwarded_proto $stellarr_hsts {
        default "";
        https "max-age=31536000";
    }

    # The Cache-Control of what nginx serves from the apps' build and of the
    # instance language file, by the status and the file served. Anything
    # else, the API's responses among them, gets an empty value, and nginx adds
    # no header for it.
    map "$status $request_filename" $stellarr_cache_control {
        default                                               "";
        # Named by their content: a new build gets new names. Only an answer
        # with the file is kept, so a 404 is asked again.
        "~^(200|206|304) /opt/stellarr/web/static/"           "public, max-age=31536000, immutable";
        # The fonts never change in place, those of the interface and those a
        # person may choose alike.
        "~^(200|206|304) /opt/stellarr/web/fonts/"            "public, max-age=31536000, immutable";
        "~^(200|206|304) /opt/stellarr/web/typefaces/"        "public, max-age=31536000, immutable";
        # Every other file keeps its name across releases, so the browser asks
        # each time and a release takes effect at the next load: the two
        # documents, release.json (the id of the release, which a running page
        # asks for to learn it is out of date), the service worker
        # (stellarr-worker.js, which browsers fetch past the cache anyway when
        # they look for a new one), the sounds, the identity and mascot art,
        # robots.txt, and the worklets, codecs, models and translation worker,
        # which must never meet a part of another release, as a cached worklet
        # would a newer WASM.
        "~^[0-9]+ /opt/stellarr/web/"                         "no-cache";
        # Written by the entrypoint at every start. The page waits for it
        # before its first paint, so asking each time would cost a round trip
        # on every load; the setting rarely changes, and a new value reaches a
        # browser within the hour.
        "~^(200|304) /run/stellarr/stellarr-instance\.js$"    "public, max-age=3600, must-revalidate";
    }

    # What answers an address of the apps that names no file of their build,
    # by the rules web/documents.ts sets for the dev and preview servers:
    #   file     in a folder that holds only files, or with a dot in its last
    #            segment: a plain 404, never a page in place of a worklet or a
    #            model, which would fail far from its cause
    #   cockpit  /cockpit and everything below it: Cockpit's document
    #   page     an address of the web client: its document
    #   missing  any other: the web client's document with 404, so the app
    #            draws its not-found page and a monitor still sees the 404
    map $uri $stellarr_address {
        default                                                                        missing;
        "~^/(audio|bergamot-models|codecs|fonts|identity|mascot|sounds|static|typefaces)(/|$)"   file;
        # A dot in the last segment. The class leaves the dot out, so each try,
        # one per dot, stops at the next dot or slash: with [^/]* every dot would
        # rescan the rest of its segment, which on a long run of dots followed
        # by a slash takes time quadratic in the length of the address.
        "~\.[^/.]*$"                                                                   file;
        "~^/cockpit(/|$)"                                                              cockpit;
        # The web client's addresses, each with or without a trailing slash.
        # They repeat the table in web/src/stellarr/routes.tsx, where a :name
        # segment is [^/]+ here, and web/documents.test.ts fails when the two
        # differ.
        "~^/$"                                                                         page;
        "~^/login/?$"                                                                  page;
        "~^/register/?$"                                                               page;
        "~^/setup/?$"                                                                  page;
        "~^/forgot-password/?$"                                                        page;
        "~^/reset-password/?$"                                                         page;
        "~^/confirm-email/?$"                                                          page;
        "~^/link-account/?$"                                                           page;
        "~^/invite/[^/]+/?$"                                                           page;
    }

    upstream stellarr_api {
        server 127.0.0.1:5000;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name _;

        if ($redirect_to_https) {
            return 308 https://__REDIRECT_HOST____PUBLIC_HTTPS_SUFFIX__$request_uri;
        }

        ssl_certificate     /run/stellarr-tls/fullchain.pem;
        ssl_certificate_key /run/stellarr-tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "microphone=(self), camera=(self), display-capture=(self)" always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security $stellarr_hsts always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' __SCRIPT_HASHES__; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' wss: https://api.giphy.com https://giphy-analytics.giphy.com; worker-src 'self' blob:; frame-src 'self' https://www.youtube-nocookie.com https://player.vimeo.com; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'self'" always;
        # Locations inherit the complete header set.
        add_header Cache-Control $stellarr_cache_control always;

        location = /health {
            proxy_pass http://stellarr_api/health/ready;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-For $stellarr_forwarded_for;
            proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;
        }

        # The desktop client's handshake reports the instance's origin, taken
        # from X-Forwarded-Host so that it keeps the port the client used.
        location = /.well-known/stellarr/client {
            proxy_pass http://stellarr_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $stellarr_forwarded_for;
            proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;
        }

        # Plain HTTP only: the API has no WebSocket endpoint outside /hubs/.
        location ~ ^/(api|assets|health)/ {
            proxy_pass http://stellarr_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $stellarr_forwarded_for;
            proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;
            proxy_read_timeout 75s;
        }

        location /hubs/ {
            proxy_pass http://stellarr_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Keep the public port for the API's WebSocket Origin check.
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $stellarr_forwarded_for;
            proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;
            proxy_read_timeout 75s;
        }

        # The instance's default language, which the web client's document
        # runs before its first paint. The entrypoint writes it from
        # STELLARR_LANGUAGE at every start.
        location = /stellarr-instance.js {
            root /run/stellarr;
            types { }
            default_type "text/javascript; charset=utf-8";
        }

        # The web client and the operator panel, Cockpit, built as static files
        # (web/dist/). A file of the build is served as it is; any other
        # address goes to @document. Only a file counts, never a directory, so
        # /cockpit is not redirected to /cockpit/.
        location / {
            root /opt/stellarr/web;
            charset utf-8;
            charset_types text/plain text/css application/javascript application/json image/svg+xml;

            # The text files and the WASM are compressed when the image is
            # built; anything without a .gz beside it is compressed here. Only
            # the apps' files are, so the API's responses go out as before. A
            # proxy in front may speak HTTP/1.0 or add Via, and its clients
            # still get compressed files.
            gzip on;
            gzip_static on;
            gzip_vary on;
            gzip_proxied any;
            gzip_http_version 1.0;
            gzip_types text/css text/plain application/javascript application/json image/svg+xml application/wasm;

            try_files $uri @document;
        }

        # An address that names no file of the build, answered as
        # $stellarr_address decides.
        location @document {
            root /opt/stellarr/web;
            # The plain 404 below is text, whatever the address's extension.
            types { }
            default_type text/plain;
            error_page 404 /index.html;
            if ($stellarr_address = file) {
                # With a body of its own the 404 goes out as it is, and
                # error_page above does not put the document in its place.
                return 404 "Not found\n";
            }
            if ($stellarr_address = missing) {
                return 404;
            }
            if ($stellarr_address = cockpit) {
                rewrite ^ /cockpit/index.html last;
            }
            rewrite ^ /index.html last;
        }
    }
}
