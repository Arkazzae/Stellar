# Template: the entrypoint replaces __PUBLIC_HTTPS_SUFFIX__ and writes the result
# to /etc/nginx/nginx.conf.
user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    # The web client's sounds; the stock list has no type for them.
    types {
        audio/wav wav;
    }
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Larger than the API's 100 MB video limit so multipart framing still fits.
    # The API enforces the per-media limits itself.
    client_max_body_size 128m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # A TLS proxy in front of this container (Nginx Proxy Manager, Caddy, a load
    # balancer) forwards plain HTTP and says so in X-Forwarded-Proto. Such a
    # request must not be redirected to HTTPS again, and the API has to see
    # "https" so that secure cookies and generated links are right.
    map $http_x_forwarded_proto $external_https {
        default 0;
        https   1;
    }

    map "$scheme:$external_https" $redirect_to_https {
        default  0;
        "http:0" 1;
    }

    map $external_https $effective_forwarded_proto {
        default $scheme;
        1       https;
    }

    # The Cache-Control of what nginx serves from the apps' build and of the
    # instance language file, by the status and the file served. Anything
    # else, the API's responses among them, gets an empty value, and nginx adds
    # no header for it.
    map "$status $request_filename" $stellarr_cache_control {
        default                                               "";
        # Named by their content: a new build gets new names. Only an answer
        # with the file is kept, so a 404 is asked again.
        "~^(200|206|304) /opt/stellarr/web/static/"           "public, max-age=31536000, immutable";
        # The fonts never change in place.
        "~^(200|206|304) /opt/stellarr/web/fonts/"            "public, max-age=31536000, immutable";
        # Every other file keeps its name across releases, so the browser asks
        # each time and a release takes effect at the next load: the two
        # documents, the sounds, the identity art, robots.txt, and the
        # worklets, codecs, models and translation worker, which must never
        # meet a part of another release, as a cached worklet would a newer
        # WASM.
        "~^[0-9]+ /opt/stellarr/web/"                         "no-cache";
        # Written by the entrypoint at every start. The page waits for it
        # before its first paint, so asking each time would cost a round trip
        # on every load; the setting rarely changes, and a new value reaches a
        # browser within the hour.
        "~^(200|304) /run/stellarr/stellarr-instance\.js$"    "public, max-age=3600, must-revalidate";
    }

    # What answers an address of the apps that names no file of their build,
    # by the rules web/documents.ts sets for the dev and preview servers:
    #   file     in a folder that holds only files, or with a dot in its last
    #            segment: a plain 404, never a page in place of a worklet or a
    #            model, which would fail far from its cause
    #   cockpit  /cockpit and everything below it: Cockpit's document
    #   page     an address of the web client: its document
    #   missing  any other: the web client's document with 404, so the app
    #            draws its not-found page and a monitor still sees the 404
    map $uri $stellarr_address {
        default                                                                 missing;
        "~^/(audio|bergamot-models|codecs|fonts|identity|sounds|static)(/|$)"   file;
        "~\.[^/]*$"                                                             file;
        "~^/cockpit(/|$)"                                                       cockpit;
        # The web client's addresses, each with or without a trailing slash.
        # They repeat the table in web/src/stellarr/routes.tsx, where a :name
        # segment is [^/]+ here, and web/documents.test.ts fails when the two
        # differ.
        "~^/$"                                                                  page;
        "~^/login/?$"                                                           page;
        "~^/register/?$"                                                        page;
        "~^/forgot-password/?$"                                                 page;
        "~^/reset-password/?$"                                                  page;
        "~^/confirm-email/?$"                                                   page;
        "~^/link-account/?$"                                                    page;
        "~^/invite/[^/]+/?$"                                                    page;
    }

    upstream stellarr_api {
        server 127.0.0.1:5000;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name _;

        if ($redirect_to_https) {
            return 308 https://$host__PUBLIC_HTTPS_SUFFIX__$request_uri;
        }

        ssl_certificate     /data/stellarr/tls/fullchain.pem;
        ssl_certificate_key /data/stellarr/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "microphone=(self), camera=(self), display-capture=(self)" always;
        # Set here and not in the apps' locations: a location with an
        # add_header of its own would drop the three above.
        add_header Cache-Control $stellarr_cache_control always;

        location = /health {
            proxy_pass http://stellarr_api/health/ready;
            proxy_set_header Host $host;
        }

        # The desktop client's handshake reports the instance's origin, taken
        # from X-Forwarded-Host so that it keeps the port the client used.
        location = /.well-known/stellarr/client {
            proxy_pass http://stellarr_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;
        }

        # Plain HTTP only: the API has no WebSocket endpoint outside /hubs/.
        location ~ ^/(api|assets|health)/ {
            proxy_pass http://stellarr_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;
            proxy_read_timeout 75s;
        }

        location /hubs/ {
            proxy_pass http://stellarr_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;
            proxy_read_timeout 75s;
        }

        # The instance's default language, which the web client's document
        # runs before its first paint. The entrypoint writes it from
        # STELLARR_LANGUAGE at every start.
        location = /stellarr-instance.js {
            root /run/stellarr;
            types { }
            default_type "text/javascript; charset=utf-8";
        }

        # The web client and the operator panel, Cockpit, built as static files
        # (web/dist/). A file of the build is served as it is; any other
        # address goes to @document. Only a file counts, never a directory, so
        # /cockpit is not redirected to /cockpit/.
        location / {
            root /opt/stellarr/web;
            charset utf-8;
            charset_types text/plain text/css application/javascript application/json image/svg+xml;

            # The text files and the WASM are compressed when the image is
            # built; anything without a .gz beside it is compressed here. Only
            # the apps' files are, so the API's responses go out as before. A
            # proxy in front may speak HTTP/1.0 or add Via, and its clients
            # still get compressed files.
            gzip on;
            gzip_static on;
            gzip_vary on;
            gzip_proxied any;
            gzip_http_version 1.0;
            gzip_types text/css text/plain application/javascript application/json image/svg+xml application/wasm;

            try_files $uri @document;
        }

        # An address that names no file of the build, answered as
        # $stellarr_address decides.
        location @document {
            root /opt/stellarr/web;
            # The plain 404 below is text, whatever the address's extension.
            types { }
            default_type text/plain;
            error_page 404 /index.html;
            if ($stellarr_address = file) {
                # With a body of its own the 404 goes out as it is, and
                # error_page above does not put the document in its place.
                return 404 "Not found\n";
            }
            if ($stellarr_address = missing) {
                return 404;
            }
            if ($stellarr_address = cockpit) {
                rewrite ^ /cockpit/index.html last;
            }
            rewrite ^ /index.html last;
        }
    }
}
