# Development stack: each process runs from a bind mount of the working tree
# and reloads on change, so editing code never needs an image build.
#
#   web     :3000       Vite's dev server: the web client, and Cockpit under /cockpit
#   api     :5000       the Rust API under cargo run and watchexec, which the browser
#                       reaches through the web proxy
#   media   :49100 UDP/TCP  Stellarr Media under cargo run and watchexec; its control
#                       API on 127.0.0.1:5200
#   mailpit :8025       catches every message the API sends; its SMTP port 1025
#                       is on loopback too
#   coturn  :3478       only with the "turn" profile
#
#   docker compose -f infra/compose/dev.yml up
#   STELLARR_TURN_ENABLED=true docker compose -f infra/compose/dev.yml --profile turn up
#
# The host ports come from STELLARR_DEV_WEB_PORT, STELLARR_DEV_API_PORT,
# STELLARR_DEV_MEDIA_PORT, STELLARR_DEV_MEDIA_CONTROL_PORT,
# STELLARR_DEV_MAILPIT_PORT and STELLARR_DEV_MAILPIT_SMTP_PORT, in the shell or
# in .env. STELLARR_DEV_POLLING=false turns the web server's polling off, and
# STELLARR_DEV_ALLOWED_HOSTS lists further host names it answers. Of the
# instance's settings, only those named without a value below are taken from
# there, and the stack sets the rest itself. There is no env_file: a checkout
# may hold the .env of a production stack, which must not reach this one whole.
#
# The first start installs the npm packages and compiles the API's and the
# media server's crates into named volumes, so it is slow. The web
# service checks the browser's binaries before it starts; those that
# artifacts/recipes/ builds from source are built on the host first, once:
# `docker buildx bake recipes`.
#
# Published ports are for clients on this machine. Media advertises both the
# host loopback port and its Docker address, which the optional TURN relay uses.

name: stellarr-dev

services:
  # An npm workspace of the repository root, which has the one
  # package-lock.json: the whole repository is mounted at /app, packages are
  # installed from the root and the dev server runs from web/, which holds the
  # web client and Cockpit (web/src/cockpit/), so one server hot-reloads both.
  web:
    image: node:24-bookworm-slim
    working_dir: /app/web
    # npm install instead of npm ci: package-lock.json lives on the host, and
    # adding a dependency should not mean rebuilding anything. ci would also
    # empty node_modules and reinstall everything on every start.
    command: >
      sh -c "(cd /app && npm install -w stellarr-web --no-audit --no-fund) &&
             npm run dev -- --host 0.0.0.0 --port 3000"
    environment:
      # Where the dev server proxies /api, /assets, /health, /hubs and
      # /.well-known/stellarr/client, as Nginx does in production.
      STELLARR_API_ORIGIN: http://api:5000
      STELLARR_ACTIVITY_DEV_ENABLED:
      STELLARR_ACTIVITY_DEV_ORIGIN: ${STELLARR_ACTIVITY_DEV_ORIGIN:-http://localhost:${STELLARR_DEV_WEB_PORT:-3000}}
      STELLARR_ACTIVITY_DEV_DOMAIN:
      STELLARR_DEV_ALLOWED_HOSTS:
      # Answered at /stellarr-instance.js, which the entrypoint writes in
      # production.
      STELLARR_LANGUAGE:
      # File events do not cross a bind mount on every host (Docker Desktop on
      # macOS and Windows), so the dev server polls for changes.
      STELLARR_DEV_POLLING: ${STELLARR_DEV_POLLING:-true}
    ports:
      - "127.0.0.1:${STELLARR_DEV_WEB_PORT:-3000}:3000"
    volumes:
      - ../../:/app
      # Named volumes keep these directories inside Docker; through the bind
      # mount they would be the host's, built for another OS. Packages npm
      # cannot hoist land in the workspace's own node_modules, which also holds
      # the dev server's cache.
      - web_root_node_modules:/app/node_modules
      - web_node_modules:/app/web/node_modules
    depends_on:
      - api

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: api-dev
    image: stellarr-api-dev:local
    working_dir: /app
    # cargo run instead of a --locked build, as for the media server: Cargo.lock
    # lives on the host, and adding a dependency should mean no more than saving
    # Cargo.toml. watchexec polls and restarts the server after every change.
    command:
      - /bin/sh
      - -ec
      - |
        export Rtc__TurnSharedSecret="$$(cat /run/stellarr-turn/secret)"
        exec watchexec --restart --poll=1s --watch crates --watch Cargo.toml \
          --watch /sdk/client.js --watch /sdk/media.js --watch /sdk/dev/room.js -- cargo run -p stellarr-api
    environment:
      STELLARR_TURN_ENABLED: ${STELLARR_TURN_ENABLED:-false}
      STELLARR_ENVIRONMENT: Development
      # Off loopback, because the browser's requests reach it from the web
      # service across the compose network, and curl through the port below.
      STELLARR_API_LISTEN: 0.0.0.0:5000
      # The stack's own settings, under the names production uses.
      STELLARR_DATA_ROOT: /data/stellarr
      # Mailpit below catches the mail.
      STELLARR_MAIL_ENABLED: "true"
      STELLARR_MEDIA_PORT: ${STELLARR_DEV_MEDIA_PORT:-49100}
      # What the entrypoint derives in production, which has no STELLARR_* name.
      Rtc__MediaControlUrl: http://media:5200
      Rtc__MediaControlSecret: stellarr-media-development-secret
      Operations__PublicUrl: http://localhost:${STELLARR_DEV_WEB_PORT:-3000}
      Desktop__CanonicalOrigin: http://127.0.0.1:${STELLARR_DEV_API_PORT:-5000}
      # Taken from the shell or .env when set there, and otherwise left unset.
      STELLARR_LANGUAGE:
      STELLARR_TIME_ZONE:
      STELLARR_INSTANCE_ID:
      STELLARR_DESKTOP_MINIMUM_VERSION:
      STELLARR_DESKTOP_RECOMMENDED_VERSION:
      STELLARR_GIPHY_API_KEY:
      STELLARR_MAIL_FROM:
      STELLARR_MAIL_FROM_NAME:
      STELLARR_SMTP_PASSWORD:
      STELLARR_RESEND_API_KEY:
      STELLARR_PUSH_ENABLED:
      STELLARR_PUSH_SUBJECT:
      STELLARR_PUSH_PUBLIC_KEY:
      STELLARR_PUSH_PRIVATE_KEY:
    ports:
      # For curl; the browser uses the web service.
      - "127.0.0.1:${STELLARR_DEV_API_PORT:-5000}:5000"
    volumes:
      - ../../api:/app
      - ../../sdk:/sdk:ro
      # Build output and the crate cache stay in the container, apart from a
      # cargo build on the host.
      - api_target:/app/target
      - cargo_registry:/usr/local/cargo/registry
      - stellarr_dev_data:/data/stellarr
      - turn_secret:/run/stellarr-turn:ro
    depends_on:
      turn-secret:
        condition: service_completed_successfully
      media:
        condition: service_started

  media:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: media-dev
    image: stellarr-media-dev:local
    working_dir: /app
    # cargo run instead of a --locked build, for the same reason as npm install:
    # Cargo.lock lives on the host, and adding a dependency should mean no more
    # than saving Cargo.toml. watchexec polls and restarts the server after
    # every change.
    command: >
      watchexec --restart --poll=1s --watch src --watch Cargo.toml
        -- cargo run
    environment:
      # The API calls the control API across the compose network, so it cannot
      # listen on loopback, and off loopback the media server refuses to start
      # without a secret.
      STELLARR_MEDIA_CONTROL_BIND: 0.0.0.0:5200
      STELLARR_MEDIA_CONTROL_SECRET: stellarr-media-development-secret
      STELLARR_MEDIA_PUBLIC_IP: 127.0.0.1
      STELLARR_MEDIA_PUBLIC_PORT: ${STELLARR_DEV_MEDIA_PORT:-49100}
    ports:
      - "127.0.0.1:${STELLARR_DEV_MEDIA_PORT:-49100}:49000/udp"
      - "127.0.0.1:${STELLARR_DEV_MEDIA_PORT:-49100}:49000/tcp"
      # For curl. Loopback only, because the secret above is in this file.
      - "127.0.0.1:${STELLARR_DEV_MEDIA_CONTROL_PORT:-5200}:5200"
    volumes:
      - ../../media:/app
      # Build output and the crate cache stay in the container, apart from a
      # cargo build on the host.
      - media_target:/app/target
      - cargo_registry:/usr/local/cargo/registry

  # A local inbox for the mail the API sends: password resets, address
  # changes, sign-in codes, security alerts and activity notifications. The
  # SMTP server is a setting in the database, so point the instance at it once,
  # in Cockpit or with the CLI inside the api container, which
  # `docker compose -f infra/compose/dev.yml exec api cargo run -q -p stellarr-cli --`
  # runs:
  #
  #   mail.enabled=true  mail.from-address=stellarr@dev.test
  #   mail.smtp.host=mailpit  mail.smtp.port=1025  mail.smtp.security=none
  #
  # Mailpit accepts any login, or none, and keeps the messages until it stops.
  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:${STELLARR_DEV_MAILPIT_PORT:-8025}:8025"
      - "127.0.0.1:${STELLARR_DEV_MAILPIT_SMTP_PORT:-1025}:1025"

  turn-secret:
    image: alpine:3.22
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        if [ ! -s /secrets/secret ]; then
          od -An -v -tx1 -N32 /dev/urandom | tr -d ' \n' > /secrets/secret.new
          mv /secrets/secret.new /secrets/secret
        fi
        grep -Eq '^[0-9a-f]{64}$' /secrets/secret
        chown 65534:65534 /secrets/secret
        chmod 600 /secrets/secret
    volumes:
      - turn_secret:/secrets

  coturn:
    profiles: ["turn"]
    image: coturn/coturn:4.6
    user: "65534:65534"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        media_ip="$$(getent ahostsv4 media | awk 'NR == 1 {print $$1}')"
        test -n "$$media_ip"
        umask 077
        printf 'static-auth-secret=%s\n' "$$(cat /run/stellarr-turn/secret)" > /tmp/stellarr-turn.conf
        exec turnserver -c /tmp/stellarr-turn.conf --log-file=stdout \
          --pidfile=/tmp/stellarr-turn.pid --userdb=/tmp/stellarr-turn.db \
          --listening-port=3478 --realm=localhost --external-ip=127.0.0.1 --use-auth-secret \
          --no-cli --no-tcp --no-tls --no-dtls --no-tcp-relay --no-multicast-peers --no-dynamic-ip-list \
          --denied-peer-ip=0.0.0.0-255.255.255.255 \
          --denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff \
          --allowed-peer-ip="$$media_ip" --min-port=49160 --max-port=49200
    ports:
      - "127.0.0.1:3478:3478/udp"
      - "127.0.0.1:49160-49200:49160-49200/udp"
    volumes:
      - turn_secret:/run/stellarr-turn:ro
    depends_on:
      turn-secret:
        condition: service_completed_successfully
      media:
        condition: service_started

volumes:
  web_root_node_modules:
  web_node_modules:
  api_target:
  media_target:
  cargo_registry:
  stellarr_dev_data:
  turn_secret:
